# cargo-nextest settings, used by CI (`--profile ci`). Locally `pnpm rust:test` runs plain `cargo test`.
# Practice from other projects: retry a failed test a bounded number of times so timing noise on a slow runner does not
# fail the whole build, never stop at the first failure, and give Windows (ConPTY) longer. A test that needed a retry is
# listed as FLAKY in the log, and must be fixed, not ignored.
[profile.ci]
retries = 2
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }

[[profile.ci.overrides]]
platform = 'cfg(windows)'
slow-timeout = { period = "60s", terminate-after = 4 }
