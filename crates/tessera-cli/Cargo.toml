[package]
name = "tessera-cli"
description = "The tessera command-line tool (TRD 4.9)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
keyring = "4.2.0"
serde_json = "1.0.154"
tessera-api = { version = "0.1.0", path = "../tessera-api" }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
