[package]
name = "tessera-sync"
description = "Optional end-to-end encrypted sync client (TRD 4.15, M11)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
argon2 = "0.6.0"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.3.4"
reqwest = { version = "0.13.5", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros"] }
