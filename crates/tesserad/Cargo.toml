[package]
name = "tesserad"
description = "Background session daemon that owns PTYs (TRD 4.10, M8)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tesserad"
path = "src/main.rs"

[dependencies]
getrandom = "0.3.4"
interprocess = "=2.4.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tessera-pty = { version = "0.1.0", path = "../tessera-pty" }
thiserror = "2.0.21"
tracing = "0.1.44"
ulid = "3.0.0"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
