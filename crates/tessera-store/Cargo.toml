[package]
name = "tessera-store"
description = "SQLite store, migrations, config.toml, keychain (TRD 5)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
croner = "3.0.1"
notify = "8.2.2"
regex = "1.13.1"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tessera-git = { version = "0.1.0", path = "../tessera-git" }
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
ulid = "3.0.0"
zstd = "0.13"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
