# Install commands follow the vendor install pages and installers; an empty Windows command means the install page is the way.
id = "devin"
name = "Devin"
binaries = ["devin"]
version-cmd = ["devin", "--version"]
prompt-mode = "type"
resume = []
yolo-flags = ["--permission-mode=bypass"]
hooks = "none"
install-url = "https://docs.devin.ai/cli"
docs-url = "https://docs.devin.ai/cli"
icon = "bot"
install-command = "curl -fsSL https://cli.devin.ai/install.sh | bash"
[usage]
source = "none"
