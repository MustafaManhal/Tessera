# Install commands follow the vendor install pages and installers; an empty Windows command means the install page is the way.
id = "mimocode"
name = "MiMo Code"
binaries = ["mimo"]
version-cmd = ["mimo", "--version"]
prompt-mode = "flag:--prompt"
resume = ["mimo", "--session", "{external_session_id}"]
yolo-flags = []
hooks = "none"
install-url = "https://github.com/XiaomiMiMo/MiMo-Code"
docs-url = "https://github.com/XiaomiMiMo/MiMo-Code"
icon = "bot"
install-command = "curl -fsSL https://mimo.xiaomi.com/install | bash"
install-command-windows = "irm https://mimo.xiaomi.com/install.ps1 | iex"
[usage]
source = "none"
