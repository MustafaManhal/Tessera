# Install commands follow the vendor install pages and installers; an empty Windows command means the install page is the way.
id = "charm"
name = "Charm"
binaries = ["crush"]
version-cmd = ["crush", "--version"]
prompt-mode = "type"
resume = []
yolo-flags = []
hooks = "none"
install-url = "https://github.com/charmbracelet/crush"
docs-url = "https://github.com/charmbracelet/crush"
icon = "bot"
install-command = "npm install -g @charmland/crush"
[usage]
source = "none"
