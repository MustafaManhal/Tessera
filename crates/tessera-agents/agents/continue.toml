# Install commands follow the vendor install pages and installers; an empty Windows command means the install page is the way.
id = "continue"
name = "Continue"
binaries = ["cn"]
version-cmd = ["cn", "--version"]
prompt-mode = "type"
resume = ["cn", "--resume", "{external_session_id}"]
yolo-flags = ["--auto"]
hooks = "none"
install-url = "https://docs.continue.dev/guides/cli"
docs-url = "https://docs.continue.dev/guides/cli"
icon = "bot"
install-command = "npm install -g @continuedev/cli"
[usage]
source = "none"
